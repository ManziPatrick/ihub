version: "3.9"

services:
  # ─────────────────────────────────────────
  #  BACKEND  (Node/Express + GraphQL)
  # ─────────────────────────────────────────
  backend:
    build: .
    container_name: ihub_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      # Server
      NODE_ENV: production
      PORT: 4000
      HOST: "::"

      # Database
      MONGO_URI: ${MONGO_URI}

      # Auth / JWT
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}

      # CORS / Clients
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      CLIENT_URL: ${CLIENT_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BACKEND_URL: ${BACKEND_URL}

      # AI Services
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HF_TOKEN: ${HF_TOKEN}

      # Ollama (local LLM)
      OLLAMA_ENABLED: "true"
      OLLAMA_ONLY: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5-coder:7b"


      # Stripe
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SUCCESS_PAYMENT_URL: ${SUCCESS_PAYMENT_URL}
      CANCEL_PAYMENT_URL: ${CANCEL_PAYMENT_URL}

      # Google / Firebase
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}

      # Email (Zoho / SMTP)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      VERIFY_EMAIL_URL: ${VERIFY_EMAIL_URL}

      # Pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Paypack
      PAYPACK_CLIENT_ID: ${PAYPACK_CLIENT_ID}
      PAYPACK_CLIENT_SECRET: ${PAYPACK_CLIENT_SECRET}
      PAYPACK_WEBHOOK_SECRET: ${PAYPACK_WEBHOOK_SECRET}
      PAYPACK_ENVIRONMENT: ${PAYPACK_ENVIRONMENT:-production}
      PAYPACK_BASE_URL: ${PAYPACK_BASE_URL}
      PAYPACK_WEBHOOK_URL: ${PAYPACK_WEBHOOK_URL}

      # Pesapal
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET}
      PESAPAL_ENVIRONMENT: ${PESAPAL_ENVIRONMENT:-production}

      # FDI Payments
      FDI_APP_ID: ${FDI_APP_ID}
      FDI_SECRET: ${FDI_SECRET}
      FDI_USE_LOCAL_MOCK: ${FDI_USE_LOCAL_MOCK:-false}

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    networks:
      - ihub_network
  # ─────────────────────────────────────────
  #  OLLAMA (Local LLM service)
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ihub_ollama
    restart: unless-stopped
    # No public exposure; accessible only from other containers on ihub_network
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - ihub_network

  # ─────────────────────────────────────────
  #  FRONTEND  (React + Vite — static preview)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ihub_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:${FRONTEND_PORT:-8080}"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server port (must match the FRONTEND_PORT on the host)
      PORT: ${FRONTEND_PORT:-8080}

      # API endpoints (injected at runtime via generate-env-config.js)
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}

      # Supabase
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}

      # Auth & OAuth
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_GOOGLE_AUTH_REDIRECT_URL: ${VITE_GOOGLE_AUTH_REDIRECT_URL:-/authgoogle}
      VITE_GOOGLE_CALLBACK_URL: ${VITE_GOOGLE_CALLBACK_URL:-/auth/google/callback}

      # Firebase
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}

      # Stripe
      VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
      VITE_STRIPE_SUCCESS_URL: ${VITE_STRIPE_SUCCESS_URL:-/success}
      VITE_STRIPE_CANCEL_URL: ${VITE_STRIPE_CANCEL_URL:-/cancel}

      # Pusher
      VITE_PUSHER_APP_ID: ${VITE_PUSHER_APP_ID}
      VITE_PUSHER_CLUSTER: ${VITE_PUSHER_CLUSTER}
      VITE_PUSHER_KEY: ${VITE_PUSHER_KEY}

      # Cloudinary
      VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}

      # Feature flags
      VITE_ENABLE_ANALYTICS: ${VITE_ENABLE_ANALYTICS:-false}
      VITE_ENABLE_STRIPE: ${VITE_ENABLE_STRIPE:-true}
      VITE_ENABLE_PUSHER: ${VITE_ENABLE_PUSHER:-true}
      VITE_ENABLE_GOOGLE_AUTH: ${VITE_ENABLE_GOOGLE_AUTH:-true}

    networks:
      - ihub_network

# ─────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ─────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────
networks:
  ihub_network:
    driver: bridge
