name: Daily DB Cleanup & Seed

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  cleanup-and-seed:
    name: Cleanup & Seed Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run duplicate cleanup
        working-directory: backend
        run: npx ts-node src/cleanupDuplicateCourses.ts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}

      - name: Run course enhancement seed
        working-directory: backend
        run: npx ts-node src/seedEnhanceCourses.ts
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
