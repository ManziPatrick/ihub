version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ihub_ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ihub_network
    environment:
      - OLLAMA_HOST=0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ihub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000

      OLLAMA_ENABLED: "true"
      OLLAMA_ONLY: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:3b"

      # AI Router — Multi-Provider (PRIMARY)
      AI_ROUTER_ENABLED: "true"
      AI_ROUTER_COOLDOWN_MS: "60000"

      # Google Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

      # Cloudflare Workers AI
      CF_API_TOKEN: ${CF_API_TOKEN}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_MODEL: ${CF_MODEL:-@cf/meta/llama-3.1-8b-instruct}

      # Groq
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

      # Cerebras
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
    depends_on:
      - ollama
    networks:
      - ihub_network
    ports:
      - "4000:4000"

volumes:
  ollama_data:

networks:
  ihub_network:
    driver: bridge

