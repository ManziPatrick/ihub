version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ihub_ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ihub_network
    environment:
      - OLLAMA_HOST=0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ihub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000

      OLLAMA_ENABLED: "true"
      OLLAMA_ONLY: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:3b"
    depends_on:
      - ollama
    networks:
      - ihub_network
    ports:
      - "4000:4000"

volumes:
  ollama_data:

networks:
  ihub_network:
    driver: bridge

