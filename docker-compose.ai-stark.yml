services:
  ollama:
    image: ollama/ollama
    container_name: ihub_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: .
    container_name: ihub_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      OLLAMA_URL: http://ollama:11434

      # AI Router — Multi-Provider (PRIMARY)
      AI_ROUTER_ENABLED: "true"
      AI_ROUTER_COOLDOWN_MS: "60000"

      # Google Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

      # Cloudflare Workers AI
      CF_API_TOKEN: ${CF_API_TOKEN}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_MODEL: ${CF_MODEL:-@cf/meta/llama-3.1-8b-instruct}

      # Groq
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

      # Cerebras
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
    depends_on:
      - ollama

volumes:
  ollama:
