services:
  ollama:
    image: ollama/ollama
    container_name: ihub_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: .
    container_name: ihub_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama:
