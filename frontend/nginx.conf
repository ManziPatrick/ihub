# ─── Frontend Nginx Configuration ─────────────────────────────────
# Serves the Vite-built SPA with pre-compressed brotli (.br) and
# gzip (.gz) assets generated by vite-plugin-compression.
# ──────────────────────────────────────────────────────────────────

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ── MIME types ──────────────────────────────────────────────────
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────
  access_log /dev/stdout combined buffer=512k flush=1m;
  error_log  /dev/stderr warn;

  # ── Performance tuning ──────────────────────────────────────────
  sendfile       on;
  tcp_nopush     on;
  keepalive_timeout 65;

  # Disable server version disclosure
  server_tokens off;

  # ── Brotli detection ────────────────────────────────────────────
  # Checks if the client's Accept-Encoding header includes "br".
  # Used in static asset locations to serve pre-compressed .br files
  # without requiring the ngx_brotli dynamic module.
  map $http_accept_encoding $brotli {
    default 0;
    ~*br 1;
  }

  # ── Gzip compression (fallback on-the-fly for uncached assets) ──
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml
    application/xml+rss;

  # ── Server ──────────────────────────────────────────────────────
  server {
    listen       ${PORT} default_server;
    server_name  _;

    root   /app/dist;
    index  index.html;

    # ── Service Worker (must NOT be cached by browser) ────────────
    # The PWA service worker must be checked on every visit so the
    # browser can detect updates and trigger the update flow.
    location = /sw.js {
      add_header Cache-Control "no-cache, must-revalidate";
      add_header Service-Worker-Allowed "/" always;
      add_header Content-Type "application/javascript" always;
      # Disable pre-compression for the SW — it must be served raw
      # so the browser can verify its integrity.
      gzip_static off;
    }

    # ── Runtime env-config (can't pre-compress; generated at boot) ─
    location = /env-config.js {
      add_header Cache-Control "no-cache, must-revalidate";
      add_header Content-Type  "application/javascript" always;
    }

    # ── Security & cache-negotiation headers ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Vary "Accept-Encoding" always;

    # ── Static assets with content hashes (far-future cache) ───────
    # Serves pre-compressed .br and .gz files (generated by
    # vite-plugin-compression) when the client supports them.
    #
    # Brotli (.br):  Uses a map + rewrite approach (no ngx_brotli
    #                module required). The rewrite terminates further
    #                processing so this must come BEFORE gzip_static.
    # Gzip (.gz):    nginx's built-in gzip_static module.
    location ~* \.(?:js|mjs|css|json|map)$ {
      # Serve pre-compressed .br if client supports it
      # NOTE: add_header MUST come before rewrite .br break because
      # rewrites in an if-block terminate location processing immediately.
      if ($brotli) {
        add_header Content-Encoding br always;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding" always;
        rewrite (.*) $1.br break;
      }

      # Fallback: serve pre-compressed .gz (built-in nginx module)
      gzip_static on;
      gzip_vary   on;

      # Let browsers cache these forever — hashed filenames change
      # on content update. Immutable tells the browser not to
      # revalidate on reload.
      add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ── Static images / fonts / media (far-future cache) ─────────
    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|avif|svg|woff2?|ttf|eot|mp4|webm|pdf)$ {
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;              # skip logging for static media
      add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # Any request that doesn't match an existing file serves
    # index.html so React Router handles the route.
    # ──────────────────────────────────────────────────────────────
    location / {
      try_files $uri $uri/ /index.html;

      # index.html is NOT hashed — cache briefly, revalidate
      location = /index.html {
        add_header Cache-Control "public, no-cache, must-revalidate";
      }
    }
  }
}
